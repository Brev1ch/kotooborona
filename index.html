<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Кото-оборона</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b2233;
        overflow: hidden;
        touch-action: none;
        /* Яндекс Игры, 1.6.1.8 и 1.10.2: долгое нажатие ничего не выделяет и не открывает меню, страница не тянется и не обновляется жестом. */
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
