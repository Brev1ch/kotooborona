<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звуки: выбор</title>
<style>
  :root { --bg: #1b2233; --panel: #252f46; --line: #3a4766; --fg: #e9e4d6; --muted: #9aa3b8; --brass: #e0a948; --on: #7cc48a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  input[type=search] { flex: 1; min-width: 200px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; }
  .count { color: var(--muted); }
  main { padding: 8px 16px 40px; }
  details { margin: 8px 0; background: var(--panel); border-radius: 8px; }
  summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
  summary .count { font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0 0 6px; }
  li { display: flex; align-items: center; gap: 10px; padding: 4px 12px; border-top: 1px solid var(--line); }
  li.playing { background: #2f3a57; }
  button, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-height: 32px; }
  button.play { width: 40px; cursor: pointer; }
  .name { flex: 1; word-break: break-all; }
  .used { color: var(--on); font-size: 12px; }
  select { max-width: 150px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--brass); color: #1b2233; padding: 8px 14px; border-radius: 6px; font-family: monospace; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: calc(100% - 32px); }
  #toast.shown { opacity: 1; }
  .hint { color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Звуки</h1>
  <input id="search" type="search" placeholder="Поиск по имени файла или события" autofocus>
  <span id="total" class="count"></span>
</header>
<main>
  <p class="hint">«Выбрать для…» копирует строку для таблицы <code>SOUNDS</code> в <code>scripts/sfx.mjs</code>; таблица сама не меняется. Подрезку (<code>trim</code>), высоту (<code>pitch</code>) и громкость (<code>gain</code>) прежнего файла строка не переносит. После замены — строка в <code>docs/CREDITS.md</code> и <code>npm run sfx</code>.</p>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script>
  const list = document.getElementById('list');
  const search = document.getElementById('search');
  const total = document.getElementById('total');
  const toast = document.getElementById('toast');
  const audio = new Audio();
  let playingRow = null;

  audio.addEventListener('ended', () => setPlaying(null));

  function setPlaying(row) {
    playingRow?.classList.remove('playing');
    playingRow?.querySelector('.play')?.replaceChildren('▶');
    playingRow = row;
    row?.classList.add('playing');
    row?.querySelector('.play')?.replaceChildren('■');
  }

  function play(file, row) {
    if (playingRow === row && !audio.paused) {
      audio.pause();
      setPlaying(null);
      return;
    }
    audio.src = `/__sound-picker/file/${file.split('/').map(encodeURIComponent).join('/')}`;
    audio.currentTime = 0;
    void audio.play();
    setPlaying(row);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Страница открыта по адресу в сети (npm run dev -- --host): там буфера обмена без https нет.
      const area = document.createElement('textarea');
      area.value = text;
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    toast.textContent = `Скопировано: ${text.trim()}`;
    toast.classList.add('shown');
    clearTimeout(copy.timer);
    copy.timer = setTimeout(() => toast.classList.remove('shown'), 2500);
  }

  function render(files, sounds) {
    const usedBy = new Map();
    for (const [id, src] of Object.entries(sounds)) usedBy.set(src, [...(usedBy.get(src) ?? []), id]);
    const events = Object.keys(sounds);
    const groups = new Map();
    for (const file of files) {
      const dir = file.includes('/') ? file.slice(0, file.lastIndexOf('/')) : '.';
      groups.set(dir, [...(groups.get(dir) ?? []), file]);
    }
    for (const [dir, group] of groups) {
      const details = document.createElement('details');
      details.open = true;
      const summary = document.createElement('summary');
      summary.append(`${dir} `);
      const count = document.createElement('span');
      count.className = 'count';
      summary.append(count);
      const ul = document.createElement('ul');
      for (const file of group) {
        const li = document.createElement('li');
        li.dataset.search = `${file} ${(usedBy.get(file) ?? []).join(' ')}`.toLowerCase();
        const button = document.createElement('button');
        button.className = 'play';
        button.textContent = '▶';
        button.title = 'Прослушать';
        button.addEventListener('click', () => play(file, li));
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = file.slice(dir.length + 1);
        const used = usedBy.get(file);
        if (used) {
          const tag = document.createElement('div');
          tag.className = 'used';
          tag.textContent = `сейчас: ${used.join(', ')}`;
          name.append(tag);
        }
        const select = document.createElement('select');
        select.append(new Option('Выбрать для…', ''));
        for (const id of events) select.append(new Option(id, id));
        select.addEventListener('change', () => {
          if (select.value) void copy(`  ${select.value}: { src: '${file}' },`);
          select.value = '';
        });
        li.append(button, name, select);
        ul.append(li);
      }
      details.append(summary, ul);
      list.append(details);
    }
    filter();
  }

  function filter() {
    const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const details of list.children) {
      let inGroup = 0;
      for (const li of details.querySelectorAll('li')) {
        const match = words.every((word) => li.dataset.search.includes(word));
        li.hidden = !match;
        if (match) inGroup++;
      }
      details.hidden = inGroup === 0;
      details.querySelector('.count').textContent = `(${inGroup})`;
      shown += inGroup;
    }
    total.textContent = `${shown} файлов`;
  }

  search.addEventListener('input', filter);

  fetch('/__sound-picker/list')
    .then((response) => response.json())
    .then(({ files, sounds }) => {
      if (files.length === 0) list.textContent = 'В assets-src/sfx нет звуков: распакуйте паки Kenney (ссылки — в начале scripts/sfx.mjs).';
      else render(files, sounds);
    });
</script>
</body>
</html>
